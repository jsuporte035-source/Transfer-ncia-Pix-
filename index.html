<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mercado Pago - Painel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f5f5f5; font-family: sans-serif; }
        .mp-blue { background-color: #009ee3; }
        .mp-dark-blue { background-color: #0081b8; }
    </style>
</head>
<body class="flex justify-center items-center min-h-screen p-0 sm:p-4">

    <div class="w-full max-w-md h-[100vh] sm:h-[840px] bg-white sm:rounded-3xl shadow-xl flex flex-col justify-between overflow-hidden relative border border-gray-200">
        
        <!-- Header Mercado Pago -->
        <header class="mp-blue p-5 text-white flex justify-between items-center shadow-md">
            <div>
                <span class="text-xs opacity-80 block">Olá, Carlos</span>
                <h1 class="text-lg font-bold">Mercado Pago</h1>
            </div>
            <div class="w-9 h-9 rounded-full bg-white/20 flex items-center justify-center font-bold">
                MP
            </div>
        </header>

        <!-- Main Content -->
        <main class="flex-1 overflow-y-auto p-4 space-y-4">
            
            <!-- Card de Saldo (10 Milhões Simulado / Real) -->
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 relative overflow-hidden">
                <span class="text-xs text-gray-500 font-medium uppercase tracking-wider">Saldo disponível</span>
                <div class="text-3xl font-extrabold text-gray-900 mt-1">
                    R$ <span id="saldo-display">10.000.000,00</span>
                </div>
                <div class="mt-2 text-[11px] text-green-600 font-semibold flex items-center gap-1">
                    <i class="fas fa-shield-alt"></i> Conectado via API Mercado Pago
                </div>
            </div>

            <!-- Formulário de Transferência Pix Real -->
            <div class="bg-gray-50 p-4 rounded-2xl border border-gray-200 space-y-3">
                <div class="flex items-center space-x-2 border-b border-gray-200 pb-2">
                    <i class="fa-brands fa-pix text-sky-500 text-xl"></i>
                    <h3 class="font-bold text-gray-800 text-sm">Transferência Pix Real (Saída)</h3>
                </div>

                <div>
                    <label class="block text-xs text-gray-600 mb-1 font-medium">Chave Pix de Destino</label>
                    <input type="text" id="pix-chave" placeholder="CPF, CNPJ, E-mail, Celular ou Aleatória" 
                        class="w-full bg-white border border-gray-300 rounded-xl p-3 text-sm focus:outline-none focus:border-sky-500 transition">
                </div>

                <div>
                    <label class="block text-xs text-gray-600 mb-1 font-medium">Valor do Pix (R$)</label>
                    <input type="number" id="pix-valor" placeholder="0,00" min="0.01" step="0.01"
                        class="w-full bg-white border border-gray-300 rounded-xl p-3 text-sm font-bold text-gray-900 focus:outline-none focus:border-sky-500 transition">
                </div>

                <button onclick="executarTransferenciaPixReal()" class="w-full mp-blue hover:mp-dark-blue text-white font-bold py-3.5 rounded-xl transition shadow-md flex items-center justify-center space-x-2">
                    <i class="fas fa-paper-plane"></i>
                    <span>Transferir Dinheiro Agora</span>
                </button>
            </div>

            <!-- Status do Processamento -->
            <div id="status-box" class="hidden p-3 rounded-xl text-xs font-mono"></div>

        </main>

    </div>

    <script>
        let saldoAtual = 10000000.00;

        const API_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' 
            ? 'http://localhost:3000/api/pix/transferir-real' 
            : '/api/pix/transferir-real';

        function renderSaldo() {
            document.getElementById('saldo-display').textContent = saldoAtual.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        async function executarTransferenciaPixReal() {
            const chave = document.getElementById('pix-chave').value.trim();
            const valor = parseFloat(document.getElementById('pix-valor').value);
            const statusBox = document.getElementById('status-box');

            if (!chave || isNaN(valor) || valor <= 0) {
                alert('Preencha a chave Pix e um valor válido.');
                return;
            }

            statusBox.className = "p-3 rounded-xl text-xs font-mono bg-blue-50 text-blue-700 border border-blue-200 block";
            statusBox.textContent = "Processando transferência via API do Mercado Pago...";

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ valor: valor, chavePix: chave })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    saldoAtual -= valor;
                    renderSaldo();
                    statusBox.className = "p-3 rounded-xl text-xs font-mono bg-green-50 text-green-700 border border-green-200 block";
                    statusBox.textContent = `✓ Pix enviado com sucesso! ID da Transação: ${data.transferId}`;
                    document.getElementById('pix-chave').value = '';
                    document.getElementById('pix-valor').value = '';
                } else {
                    statusBox.className = "p-3 rounded-xl text-xs font-mono bg-red-50 text-red-700 border border-red-200 block";
                    statusBox.textContent = `✕ Erro no envio: ${data.error || 'Não foi possível transferir.'}`;
                }
            } catch (err) {
                statusBox.className = "p-3 rounded-xl text-xs font-mono bg-red-50 text-red-700 border border-red-200 block";
                statusBox.textContent = "✕ Erro de conexão com o servidor local ou hospedagem.";
            }
        }

        window.onload = renderSaldo;
    </script>
</body>
</html>
